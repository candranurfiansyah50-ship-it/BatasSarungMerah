<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Zona Risiko DBD - Pasongsongan</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map {
            width: 100%;
            height: 100vh;
        }
        body {
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Firebase SDK (Modular v9/v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Konfigurasi Firebase Anda (Sesuaikan dengan project Anda)
        const firebaseConfig = {
            apiKey: "API_KEY_ANDA",
            authDomain: "PROJECT_ID.firebaseapp.com",
            projectId: "PROJECT_ID",
            storageBucket: "PROJECT_ID.appspot.com",
            messagingSenderId: "MESSAGING_SENDER_ID",
            appId: "APP_ID"
        };

        // Inisialisasi Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Inisialisasi Peta Leaflet (Berpusat di Pasongsongan, Sumenep)
        const map = L.map('map').setView([-6.88, 113.65], 12);

        // Tambahkan Tile Layer (Basemap OpenStreetMap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Fungsi utama untuk memuat data dan merender peta
        async function loadMapData() {
            try {
                // 1. Ambil semua dokumen dari koleksi 'laporan_dbd'
                const querySnapshot = await getDocs(collection(db, "laporan_dbd"));
                const caseCounts = {};

                // Hitung jumlah kasus per desa berdasarkan dokumen pasien
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    let namaDesa = data.desa ? data.desa.trim() : "";
                    
                    // Normalisasi nama desa jika diperlukan (misal: pastikan format sama dengan GeoJSON)
                    if (namaDesa) {
                        caseCounts[namaDesa] = (caseCounts[namaDesa] || 0) + 1;
                    }
                });

                console.log("Rekap Kasus per Desa:", caseCounts);

                // 2. Ambil file GeoJSON wilayah (pastikan file pasongsongan.geojson berada di folder yang sama)
                const response = await fetch('pasongsongan.geojson');
                const geojsonData = await response.json();

                // 3. Tambahkan Layer GeoJSON ke Peta dengan Styling Dinamis
                L.geoJson(geojsonData, {
                    style: function (feature) {
                        // Sesuaikan 'DESA' atau 'nama' dengan properti nama desa di file GeoJSON Anda
                        const namaDesaGeo = feature.properties.DESA || feature.properties.nama || ""; 
                        
                        // Ambil jumlah kasus untuk desa tersebut (default 0 jika tidak ada)
                        const totalKasus = caseCounts[namaDesaGeo] || 0;

                        // Tentukan warna berdasarkan ketentuan zona (< 5 Aman/Hijau, >= 5 Merah)[cite: 20]
                        const warna = totalKasus >= 5 ? "#ff0000" : "#28a745"; // Merah atau Hijau

                        return {
                            fillColor: warna,
                            weight: 2,
                            opacity: 1,
                            color: 'white',
                            dashArray: '3',
                            fillOpacity: 0.6
                        };
                    },
                    onEachFeature: function (feature, layer) {
                        const namaDesaGeo = feature.properties.DESA || feature.properties.nama || "Wilayah";
                        const totalKasus = caseCounts[namaDesaGeo] || 0;
                        const statusZona = totalKasus >= 5 ? "Zona Merah" : "Zona Aman";

                        // Tambahkan Popup informasi saat desa diklik
                        layer.bindPopup(`
                            <strong>Desa:</strong> ${namaDesaGeo}<br>
                            <strong>Jumlah Kasus:</strong> ${totalKasus} Kasus<br>
                            <strong>Status:</strong> <span style="color: ${totalKasus >= 5 ? 'red' : 'green'}; font-weight: bold;">${statusZona}</span>
                        `);
                    }
                }).addTo(map);

            } catch (error) {
                console.error("Gagal memuat data peta atau firebase:", error);
            }
        }

        // Jalankan fungsi saat halaman dimuat
        loadMapData();
    </script>
</body>
</html>
